<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — Four Nations</title>

<!--
  ============================================================================
  FOUR NATIONS PORTFOLIO — working prototype
  ----------------------------------------------------------------------------
  Everything you edit lives in the CONFIG block at the top of the <script> tag
  at the bottom of this file. Add a project by dropping an object into the
  `projects` array of whichever nation it belongs to. Nothing else needs to
  change — cards, counts, and detail panes all build themselves.

  All artwork here is original: traditional motifs (seigaiha wave scales,
  meander border, ink-brush mountain glyphs, enso seals) rendered from scratch.
  No show assets are used, and none should be added.
  ============================================================================
-->

<style>
/* ═══ TOKENS ══════════════════════════════════════════════════════════════ */
:root{
  /* Shared ground — the parchment the whole scroll is mounted on */
  --paper:        #d9cbab;
  --paper-deep:   #c2b191;
  --paper-edge:   #a8916b;
  --ink:          #241c14;
  --ink-soft:     #4a3b2a;
  --ink-faint:    rgba(36,28,20,.42);

  /* Parchment grain — fine isotropic noise, tiled seamlessly (stitchTiles)
     so no repeat seam or directional streak is visible, kept to a low
     rect opacity so it reads as a faint irregularity in the paper rather
     than a pattern. Baked into the Hub's own background (via
     background-blend-mode below) so it's always beneath the page's
     content, never an overlay drawn on top of cards or links. */
  --grain-img: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='p' x='0%25' y='0%25' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='260' height='260' filter='url(%23p)' opacity='0.14'/></svg>");

  /* Ocean — the connective tissue between every nation */
  --sea:          #3a3760;
  --sea-deep:     #2b2949;
  --sea-line:     #5d5a8c;

  /* Nation grounds — each spoke sits on its own earth */
  --water-ground: #12283c;  --water-mass: #b9d6e8;  --water-key: #7fb4d6;  --water-glow: #d8ecf8;
  --earth-ground: #1d2716;  --earth-mass: #e3d2a2;  --earth-key: #7d9c46;  --earth-glow: #f0e4bd;
  --fire-ground:  #240d09;  --fire-mass:  #e07b3c;  --fire-key:  #c8451c;  --fire-glow:  #f4b463;
  --air-ground:   #2a1e12;  --air-mass:   #eceae2;  --air-key:   #d98f2c;  --air-glow:   #f7f2e6;

  /* Type scale — major third (1.25), fluid */
  --t--1: clamp(.72rem, .70rem + .12vw, .80rem);
  --t-0:  clamp(1rem, .96rem + .18vw, 1.09rem);
  --t-1:  clamp(1.20rem, 1.13rem + .30vw, 1.36rem);
  --t-2:  clamp(1.44rem, 1.32rem + .52vw, 1.70rem);
  --t-3:  clamp(1.73rem, 1.53rem + .86vw, 2.13rem);
  --t-4:  clamp(2.07rem, 1.75rem + 1.38vw, 2.66rem);
  --t-5:  clamp(2.49rem, 1.98rem + 2.20vw, 3.33rem);

  /* Faces. Swap these two lines for real webfonts when you go to production —
     a high-contrast old-style serif for display, a quiet humanist for body. */
  --face-display: "Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
  --face-body:    ui-sans-serif,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;

  --measure: 62ch;
  --ease-ink: cubic-bezier(.22,.68,.24,1);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:var(--t-0)/1.65 var(--face-body);
  overflow-x:hidden;
}

/* ═══ SCROLLBARS ══════════════════════════════════════════════════════════
   The page scroll and the detail sheet's own inner scroll are two separate
   scrolling boxes (window vs. element), which browsers render with
   different default chrome. Style both explicitly so they paint identically. */
html,#sheet .panel{
  scrollbar-width:thin;
  scrollbar-color:var(--ink-soft) var(--paper-deep);
}
html::-webkit-scrollbar,#sheet .panel::-webkit-scrollbar{width:12px}
html::-webkit-scrollbar-track,#sheet .panel::-webkit-scrollbar-track{background:var(--paper-deep)}
html::-webkit-scrollbar-thumb,#sheet .panel::-webkit-scrollbar-thumb{
  background:var(--ink-soft);border-radius:7px;border:3px solid var(--paper-deep)}
html::-webkit-scrollbar-thumb:hover,#sheet .panel::-webkit-scrollbar-thumb:hover{background:var(--ink)}

::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2.5px solid currentColor;outline-offset:4px;border-radius:2px}

/* ═══ SHARED PARTS ════════════════════════════════════════════════════════ */
.cartouche{
  font-family:var(--face-display);
  letter-spacing:.24em;text-transform:uppercase;
  font-size:var(--t--1);
}
.rule{height:1px;background:var(--ink-faint);border:0;margin:0}

.brushbtn{
  font:600 var(--t--1)/1 var(--face-body);
  letter-spacing:.16em;text-transform:uppercase;
  background:none;border:0;color:inherit;cursor:pointer;
  padding:.9em 0;display:inline-flex;gap:.7em;align-items:center;
}
.brushbtn span{display:inline-block;transition:transform .35s var(--ease-ink)}
.brushbtn:hover span:first-child{transform:translateX(-5px)}

/* ═══ HUB — the scroll ════════════════════════════════════════════════════
   Full-bleed page. The parchment fiber texture is part of #hub's own
   background (background-blend-mode multiplies the grain into the paper
   color at the paint step), so it sits beneath every child element —
   cards and the linktree paint on top of it, never under an overlay. */
#hub{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:clamp(1rem,3vw,2.5rem);
  background-color:var(--paper);
  background-image:var(--grain-img);
  background-blend-mode:multiply;
  background-size:260px 260px;
}

.hub-head{text-align:center;max-width:52ch;margin:clamp(.5rem,2vw,1.5rem) auto clamp(1rem,2.5vw,2rem)}
.hub-name{
  font-family:var(--face-display);
  font-size:var(--t-5);line-height:1;margin:0;
  letter-spacing:.02em;font-weight:400;
}
.hub-name em{font-style:normal;display:block;font-size:var(--t--1);letter-spacing:.42em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:.9em;padding-left:.42em}
.hub-line{margin:1.1em auto 0;max-width:46ch;color:var(--ink-soft);font-size:var(--t-0)}

.map-frame{width:min(100%,1180px);margin-inline:auto}
.map-frame svg{display:block;width:100%;height:auto}

/* Region interaction */
.region{cursor:pointer;transform-origin:center;transition:transform .5s var(--ease-ink)}
.region .mass{transition:filter .5s var(--ease-ink)}
.region:hover,.region:focus-visible{transform:translateY(-7px)}
.region:hover .mass,.region:focus-visible .mass{filter:brightness(1.13) saturate(1.1)}
.region:focus-visible{outline:none}
.region .halo{opacity:0;pointer-events:none;transition:opacity .5s var(--ease-ink)}
.region:hover .halo,.region:focus-visible .halo{opacity:.55}
.region .tag{transition:opacity .4s var(--ease-ink),transform .5s var(--ease-ink)}
.region:hover .tag,.region:focus-visible .tag{transform:translateY(-3px)}
.dim .region:not(:hover):not(:focus-visible){opacity:.55;transition:opacity .4s var(--ease-ink)}

/* Corner seals answer the map */
.seal{transition:opacity .45s var(--ease-ink);opacity:.5}
.seal .seal-mark{transition:transform .45s var(--ease-ink);transform-box:fill-box;transform-origin:center}
.seal.lit{opacity:1}
.seal.lit .seal-mark{transform:scale(1.04)}

.hub-foot{
  width:min(100%,1180px);margin:clamp(1.2rem,3vw,2.4rem) auto 0;
  display:flex;flex-wrap:wrap;gap:.4em 2.2em;justify-content:center;
  padding:1.4rem 1rem 1.6rem;border-top:1px solid var(--ink-faint);
}
.hub-foot a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--ink-faint);
  font-size:var(--t--1);letter-spacing:.14em;text-transform:uppercase;padding-bottom:.25em}
.hub-foot a:hover{color:var(--ink);border-color:var(--ink)}

/* Panel grid — the four sections named plainly, plus the Lotus below.
   Doubles as the tap-target grid on small screens, where the map's
   regions go inert (see .region pointer-events rule further down). */
.panel-grid{
  width:min(100%,1180px);margin:clamp(1.6rem,3.4vw,2.6rem) auto 0;
  display:grid;grid-template-columns:1fr 1fr;gap:clamp(.7rem,1.8vw,1rem);
}
.panel-card{
  position:relative;display:flex;align-items:center;gap:1.15rem;
  background:var(--paper-deep);
  border:1px solid var(--ink-faint);
  padding:clamp(1.1rem,2.6vw,1.5rem) clamp(1.2rem,3vw,1.7rem);
  text-align:left;font:inherit;color:inherit;cursor:pointer;
  transition:transform .4s var(--ease-ink),border-color .4s var(--ease-ink),
             background-color .4s var(--ease-ink),box-shadow .4s var(--ease-ink);
}
.panel-card svg{width:clamp(44px,5.6vw,56px);height:clamp(44px,5.6vw,56px);flex:none;
  transition:transform .45s var(--ease-ink)}
.panel-card .pc-text{min-width:0}
.panel-card .pc-text b{display:block;font-family:var(--face-display);font-weight:400;
  font-size:var(--t-2);letter-spacing:.01em}
.panel-card .pc-text i{display:block;font-style:normal;margin-top:.3em;font-size:var(--t--1);
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);
  transition:color .4s var(--ease-ink)}
.panel-card:hover,.panel-card:focus-visible{
  transform:translateY(-5px);
  border-color:var(--pk);
  background:color-mix(in srgb, var(--pk) 22%, var(--paper-deep));
  box-shadow:0 16px 32px -20px var(--pk);
}
.panel-card:hover svg,.panel-card:focus-visible svg{transform:scale(1.08) rotate(-4deg)}
.panel-card:hover .pc-text i,.panel-card:focus-visible .pc-text i{color:var(--pk)}
.panel-card:focus-visible{outline:none}

/* The Lotus — spans both columns. Not one nation's color: the sea's,
   the thing that's already the connective tissue between all four. */
.lotus-card{grid-column:1/-1;--pk:var(--sea-line);align-items:flex-start}
.lotus-card svg{width:clamp(50px,6.4vw,64px);height:clamp(50px,6.4vw,64px);margin-top:.15em}
.lotus-card .pc-text p{margin:.55em 0 0;font-size:var(--t--1);color:var(--ink-soft);
  line-height:1.55;max-width:52ch;transition:color .4s var(--ease-ink)}
.lotus-card:hover .pc-text p,.lotus-card:focus-visible .pc-text p{color:var(--ink)}

@media (max-width:600px){
  .panel-grid{grid-template-columns:1fr}
  .lotus-card{grid-column:auto}
}

/* ═══ SPOKE — a nation ════════════════════════════════════════════════════
   Same parchment-fiber texture as #hub, blended with soft-light instead of
   multiply — multiply would just crush the grain into these dark grounds. */
#spoke{
  display:none;min-height:100dvh;color:var(--fg);
  background-color:var(--bg);
  background-image:var(--grain-img);
  background-blend-mode:soft-light;
  background-size:260px 260px;
}
#spoke.on{display:block}
.wrap{width:min(100%,1100px);margin-inline:auto;padding:clamp(1.5rem,4vw,3.5rem) clamp(1.1rem,4vw,2.5rem)}

.spoke-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding-bottom:2.5rem}
.spoke-top .brushbtn{color:var(--fg)}
.spoke-top .spoke-symbol{display:inline-flex;flex:none}
.spoke-top .spoke-symbol svg{width:clamp(30px,4vw,42px);height:clamp(30px,4vw,42px);display:block}

.spoke-head{display:grid;grid-template-columns:auto 1fr;gap:clamp(1.2rem,3vw,2.4rem);
  align-items:start;padding-bottom:clamp(2rem,5vw,3.5rem)}
.spoke-head svg{width:clamp(74px,11vw,116px);height:auto;flex:none}
.spoke-kicker{font-size:var(--t--1);letter-spacing:.34em;text-transform:uppercase;
  color:var(--accent);margin:0 0 .7em}
.spoke-title{font-family:var(--face-display);font-weight:400;font-size:var(--t-4);
  line-height:1.05;margin:0}
.spoke-blurb{margin:1.1em 0 0;max-width:var(--measure);color:var(--fg-soft);font-size:var(--t-1);
  line-height:1.6}

.sec-label{display:flex;align-items:baseline;gap:1rem;margin:0 0 1.8rem;
  font-size:var(--t--1);letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.sec-label::after{content:"";flex:1;height:1px;background:currentColor;opacity:.32}

/* Projects stack one per row (no auto-fill columns) — each row splits into
   the write-up on the left and a reserved slot on the right for a project
   image. With no image set, that slot just stays blank paper. */
.grid{display:grid;gap:1px;background:var(--hair);border:1px solid var(--hair)}
.card{background:var(--bg);padding:clamp(1.4rem,3vw,2rem);
  display:grid;grid-template-columns:1fr minmax(220px,38%);gap:clamp(1.2rem,3vw,2.2rem);
  text-align:left;font:inherit;color:inherit;border:0;cursor:pointer;
  transition:background .35s var(--ease-ink)}
.card:hover,.card:focus-visible{background:var(--bg-lift)}
.card-body{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.card h3{font-family:var(--face-display);font-weight:400;font-size:var(--t-2);margin:0;line-height:1.15}
.card .meta{font-size:var(--t--1);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0}
.card-body p{margin:0;color:var(--fg-soft);font-size:var(--t-0)}
.card-media{background:var(--bg-lift);min-height:140px;border:1px solid var(--hair)}
.card-media img{width:100%;height:100%;object-fit:cover;display:block}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto;padding-top:.5rem}
.tag-chip{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--hair);padding:.35em .7em;color:var(--fg-soft)}

.timeline{display:grid;gap:1px;background:var(--hair);border:1px solid var(--hair);margin-bottom:3.5rem}
.tl-item{background:var(--bg);padding:clamp(1.4rem,3vw,2rem);
  display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:1.4rem}
.tl-when{font-size:var(--t--1);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.tl-item h3{font-family:var(--face-display);font-weight:400;font-size:var(--t-2);margin:0 0 .5em}
.tl-item p{margin:0;color:var(--fg-soft);max-width:var(--measure)}

/* Shared link-button row — used in the detail sheet and timeline entries. */
.link-row{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.1rem}
.link-row a{color:var(--fg);text-decoration:none;border:1px solid var(--hair);
  padding:.65em 1.15em;font-size:var(--t--1);letter-spacing:.14em;text-transform:uppercase}
.link-row a:hover{background:var(--bg-lift)}

.empty{border:1px dashed var(--hair);padding:2.4rem;color:var(--fg-soft);text-align:center;
  font-size:var(--t-0)}

/* ═══ DETAIL SHEET ════════════════════════════════════════════════════════ */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,7,5,.62);opacity:0;
  transition:opacity .4s var(--ease-ink)}
#sheet.in .scrim{opacity:1}
#sheet .panel{
  position:absolute;inset:0;width:100%;height:100%;
  background-color:var(--bg);
  background-image:var(--grain-img);
  background-blend-mode:soft-light;
  background-size:260px 260px;
  color:var(--fg);overflow-y:auto;
  padding:clamp(1.6rem,4vw,3rem);
  transform:translateY(26px);opacity:0;
  transition:transform .5s var(--ease-ink),opacity .4s var(--ease-ink);
}
#sheet.in .panel{transform:none;opacity:1}
#sheet .sheet-inner{max-width:900px;margin:0 auto}
#sheet h2{font-family:var(--face-display);font-weight:400;font-size:var(--t-4);margin:.6em 0 .2em;line-height:1.08}
#sheet .lede{color:var(--fg-soft);font-size:var(--t-1);max-width:var(--measure);margin:1em 0 2em}
#sheet h4{font-size:var(--t--1);letter-spacing:.3em;text-transform:uppercase;color:var(--accent);
  margin:2.4em 0 .9em;font-weight:600}
#sheet p{max-width:var(--measure);color:var(--fg-soft)}
#sheet ul{max-width:var(--measure);color:var(--fg-soft);padding-left:1.1em;margin:0}
#sheet li{margin-bottom:.6em}
#sheet .link-row{margin-top:2.4rem}
#sheet .link-row a{padding:.75em 1.3em;letter-spacing:.16em}
#sheet .sheet-media{margin:1.6rem 0 0;max-width:var(--measure)}
#sheet .sheet-media img{width:100%;height:auto;display:block;border:1px solid var(--hair)}

/* ═══ ALL WORK — every nation's spoke, stacked in one scroll ═════════════
   Each nation-block below renders the exact same header/timeline/card
   markup as its individual spoke page (see nationBody()), just wrapped in
   its own full-bleed background band instead of taking over the whole
   viewport. The page opens straight into Air's colors — the back button
   and symbol live inside the first (Air) block, not a separate strip. */
.allwork{--bg:var(--paper);--fg:var(--ink);--fg-soft:var(--ink-soft);
  --accent:var(--ink-soft);--hair:rgba(36,28,20,.22);--bg-lift:rgba(255,255,255,.28)}

.nation-block{
  background-color:var(--bg);
  background-image:var(--grain-img);
  background-blend-mode:soft-light;
  background-size:260px 260px;
  color:var(--fg);
}

@keyframes plain-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.enter-all .wrap{animation:plain-in .5s var(--ease-ink) both}

/* ═══ ELEMENTAL TRANSITIONS ═══════════════════════════════════════════════
   One system, four dialects. Air drifts, water wipes, earth lands hard,
   fire flares. Transform + opacity only — nothing that triggers layout. */
@keyframes air-in  {from{opacity:0;transform:translateY(-22px) scale(1.012);filter:blur(5px)}
                    to  {opacity:1;transform:none;filter:none}}
@keyframes water-in{from{opacity:0;transform:translateX(-40px)}
                    to  {opacity:1;transform:none}}
@keyframes earth-in{0%{opacity:0;transform:translateY(46px)}
                    72%{opacity:1;transform:translateY(-4px)}
                    100%{transform:none}}
@keyframes fire-in {0%{opacity:0;transform:scale(.965);filter:brightness(2.1) saturate(.4)}
                    45%{opacity:1;filter:brightness(1.35)}
                    100%{transform:none;filter:none}}
.enter-air   .wrap{animation:air-in   .70s var(--ease-ink) both}
.enter-water .wrap{animation:water-in  .60s var(--ease-ink) both}
.enter-earth .wrap{animation:earth-in .55s cubic-bezier(.3,.9,.2,1) both}
.enter-fire  .wrap{animation:fire-in  .55s var(--ease-ink) both}

/* Load sequence for the map */
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade-in{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.boot .coast{stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw 1.5s var(--ease-ink) forwards}
.boot .mass{opacity:0;animation:fade-in .9s .55s var(--ease-ink) forwards}
.boot .detail{opacity:0;animation:fade-in .8s .95s var(--ease-ink) forwards}
.boot .tag{opacity:0;animation:rise .7s 1.15s var(--ease-ink) forwards}
.boot .seal{opacity:0;animation:fade-in .8s 1.3s var(--ease-ink) forwards}
.boot .seal.lit{opacity:1}
.hub-head{animation:rise .8s var(--ease-ink) both}
.hub-foot{animation:rise .8s .25s var(--ease-ink) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;
    transition-duration:.001ms!important}
  .boot .coast{stroke-dashoffset:0}
}

/* ═══ RESPONSIVE ══════════════════════════════════════════════════════════ */
@media (max-width:880px){
  .region{pointer-events:none}
  .tl-item{grid-template-columns:1fr;gap:.6rem}
  .card{grid-template-columns:1fr}
  .card-media{display:none}
  .spoke-head{grid-template-columns:1fr}
}
</style>

<!-- ═══════════════════════════ HUB ═══════════════════════════ -->
<main id="hub" class="boot">
  <header class="hub-head">
    <h1 class="hub-name"><em id="hub-kicker"></em><span id="hub-title"></span></h1>
    <p class="hub-line" id="hub-line"></p>
  </header>

  <div class="map-frame">
    <svg id="map" viewBox="0 0 1600 1000" role="group" aria-label="Interactive map. Four regions lead to four sections of work.">
      <defs>
        <!-- Seigaiha: the traditional wave-scale field that carries the ocean -->
        <pattern id="waves" width="64" height="32" patternUnits="userSpaceOnUse">
          <rect width="64" height="32" fill="var(--sea-deep)"/>
          <g fill="none" stroke="var(--sea-line)" stroke-width="2.2" opacity=".85">
            <path d="M0,32 A32,32 0 0,1 64,32"/>
            <path d="M9,32 A23,23 0 0,1 55,32"/>
            <path d="M18,32 A14,14 0 0,1 46,32"/>
            <path d="M27,32 A5,5 0 0,1 37,32"/>
            <path d="M-32,16 A32,32 0 0,1 32,16"/>
            <path d="M-23,16 A23,23 0 0,1 23,16"/>
            <path d="M-14,16 A14,14 0 0,1 14,16"/>
            <path d="M32,16 A32,32 0 0,1 96,16"/>
            <path d="M41,16 A23,23 0 0,1 87,16"/>
            <path d="M50,16 A14,14 0 0,1 78,16"/>
          </g>
        </pattern>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="14"/>
        </filter>

        links  : [
          { label: "Official Degree", href: "https://www.parchment.com/lp/award/bc851b54-c559-4d6b-9672-626c1a6f6503" },
          { label: "Transcript", href: "TR5AGB1F.pdf" }
        ]
      }
    ]
  }
};

/* ── Nation visual identities. Change a hex here and it propagates. ────── */
const SKIN = {
  water: { bg:"var(--water-ground)", lift:"#183449", accent:"var(--water-key)", mass:"var(--water-mass)" },
  earth: { bg:"var(--earth-ground)", lift:"#26311d", accent:"var(--earth-key)", mass:"var(--earth-mass)" },
  fire : { bg:"var(--fire-ground)",  lift:"#31130d", accent:"var(--fire-key)",  mass:"var(--fire-mass)"  },
  air  : { bg:"var(--air-ground)",   lift:"#36271a", accent:"var(--air-key)",   mass:"var(--air-mass)"   }
};

/* Seal glyphs: an enso ring plus one abstract stroke per element.
   Original marks — deliberately not the show's insignia. */
const SEAL = {
  water: 'M -22 4 C -12 -8, -2 12, 10 0 M -18 16 C -8 4, 4 22, 18 10',
  earth: 'M -20 14 H 20 M 0 14 V -12 M -12 -2 H 12',
  fire : 'M 0 -20 C 12 -6, 14 8, 2 18 C -10 8, -12 -4, 0 -20 M 0 6 C 5 0, 4 -7, 0 -12',
  air  : 'M -22 -4 C -6 -16, 8 -12, 14 -2 C 18 6, 8 14, 2 8 M -20 10 C -6 2, 6 6, 16 12'
};
const ORDER = ["air","water","fire","earth"];
const SEAL_POS = { air:[150,180], water:[1450,180], fire:[150,700], earth:[1450,700] };

/* ╔══════════════════════════════════════════════════════════════════════╗
   ║  Below here is machinery. You shouldn't need to edit it.             ║
   ╚══════════════════════════════════════════════════════════════════════╝ */

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── Hub chrome ─────────────────────────────────────────────────────────── */
$("#hub-kicker").textContent = SITE.kicker;
$("#hub-title").textContent  = SITE.name;
$("#hub-line").textContent   = SITE.line;
$("#hubFoot").innerHTML = SITE.links
  .map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");

/* ── Seals on the map ───────────────────────────────────────────────────── */
$("#seals").innerHTML = ORDER.map(k => {
  const [x,y] = SEAL_POS[k];
  return `<g class="seal" data-seal="${k}" transform="translate(${x},${y})">
    <g class="seal-mark">
      <rect x="-74" y="-74" width="148" height="148" fill="var(--paper-deep)" stroke="var(--paper-edge)" stroke-width="6"/>
      <circle r="52" fill="${SKIN[k].mass}" opacity=".9"/>
      <circle r="52" fill="none" stroke="var(--ink)" stroke-width="3.5" opacity=".55"
        stroke-dasharray="300 26" transform="rotate(-42)"/>
      <path d="${SEAL[k]}" fill="none" stroke="var(--ink)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>`;
}).join("");

/* ── Meander (key-fret) border: one tile, wrapped evenly around all four
   sides of the frame so it reads as a continuous, finished border rather
   than a run that stops partway along one edge. ─────────────────────────── */
(function(){
  const step = 40; // nominal spacing of one tile (28 drawn + 12 gap)
  const sides = [
    { len: 1428, from: [86, 34],    axis: [1, 0],  rot: 0   }, // top
    { len: 868,  from: [1546, 66],  axis: [0, 1],  rot: 90  }, // right
    { len: 1428, from: [1514, 966], axis: [-1, 0], rot: 180 }, // bottom
    { len: 868,  from: [54, 934],   axis: [0, -1], rot: 270 }  // left
  ];
  const uses = [];
  sides.forEach(s => {
    const count = Math.max(1, Math.round(s.len / step));
    const spacing = s.len / count;
    for (let i = 0; i < count; i++){
      const d = i * spacing;
      const x = s.from[0] + s.axis[0] * d;
      const y = s.from[1] + s.axis[1] * d;
      uses.push(`<use href="#keyTile" transform="translate(${x.toFixed(2)},${y.toFixed(2)}) rotate(${s.rot})"/>`);
    }
  });
  $("#meander").innerHTML = uses.join("");
})();

/* ── Panel grid: the four sections named plainly, plus the Lotus ───────────
   Order and copy are fixed on purpose — this is the plain-language index
   of the map above, not a restatement of each nation's own framing. */
const PANEL_ORDER = ["air","water","fire","earth"];
const PANEL_SUBTITLE = {
  air  : "Who Am I?",
  water: "Data Science & Analytics",
  earth: "Full-Stack Applications",
  fire : "Personal Projects"
};

function lotusSVG(){
  const cols = [SKIN.water.accent, SKIN.earth.accent, SKIN.fire.accent, SKIN.air.accent];
  const petal = i => `<path transform="rotate(${i*45})"
      d="M0,-8 C 15,-30 15,-56 0,-68 C -15,-56 -15,-30 0,-8 Z"
      fill="${cols[i%4]}" fill-opacity=".82" stroke="var(--ink)" stroke-width="2.4"/>`;
  return `<svg viewBox="-80 -80 160 160" aria-hidden="true">
    ${Array.from({length:8},(_,i)=>petal(i)).join("")}
    <circle r="15" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
  </svg>`;
}

$("#panelGrid").innerHTML = PANEL_ORDER.map(k => `
    <button class="panel-card" data-nation="${k}" style="--pk:${SKIN[k].accent}">
      ${sealSVG(k)}
      <span class="pc-text"><b>${esc(NATIONS[k].name)}</b><i>${esc(PANEL_SUBTITLE[k])}</i></span>
    </button>`).join("") + `
    <button class="panel-card lotus-card" id="allBtn">
      ${lotusSVG()}
      <span class="pc-text">
        <b>White Lotus</b><i>All Four Nations in Harmony</i>
      </span>
    </button>`;

/* ── Map interaction: hover a region, its seal lights ───────────────────── */
const map = $("#map");
map.querySelectorAll(".region").forEach(r => {
  const k = r.dataset.nation;
  const seal = map.querySelector(`[data-seal="${k}"]`);
  const on  = () => { map.parentElement.classList.add("dim"); seal.classList.add("lit"); };
  const off = () => { map.parentElement.classList.remove("dim"); seal.classList.remove("lit"); };
  r.addEventListener("mouseenter", on);
  r.addEventListener("mouseleave", off);
  r.addEventListener("focus", on);
  r.addEventListener("blur", off);
  r.addEventListener("click", () => go(k));
  r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(k); } });
});
$("#panelGrid").querySelectorAll("[data-nation]").forEach(b =>
  b.addEventListener("click", () => go(b.dataset.nation)));
$("#allBtn").addEventListener("click", () => { location.hash = "/all"; });

/* ── Routing ────────────────────────────────────────────────────────────── */
function go(k){ location.hash = "/" + k; }
function home(){ location.hash = ""; }

function wireCards(root){
  root.querySelectorAll("[data-all]").forEach(r => {
    const [nk, idx] = r.dataset.all.split(":");
    r.addEventListener("click", () => openSheet(nk, +idx));
  });
}

function route(){
  const k = location.hash.replace(/^#\/?/, "");
  const spoke = $("#spoke");
  closeSheet(true);

  if (k === "all") {
    $("#hub").style.display = "none";
    document.body.style.background = SKIN.air.bg;
    spoke.innerHTML = renderAll();
    spoke.className = "on allwork enter-all";
    spoke.removeAttribute("style");
    window.scrollTo(0,0);
    $("#spoke .brushbtn")?.focus({preventScroll:true});
    wireCards(spoke);
    spoke.querySelector("[data-home]").addEventListener("click", home);
    return;
  }

  if (!NATIONS[k]) {
    spoke.className = ""; spoke.innerHTML = "";
    spoke.removeAttribute("style");
    $("#hub").style.display = "";
    document.body.style.background = "var(--paper)";
    return;
  }
  $("#hub").style.display = "none";
  document.body.style.background = SKIN[k].bg;
  spoke.innerHTML = renderNation(k);
  spoke.className = "on enter-" + k;
  spoke.style.setProperty("--bg",       SKIN[k].bg);
  spoke.style.setProperty("--bg-lift",  SKIN[k].lift);
  spoke.style.setProperty("--accent",   SKIN[k].accent);
  spoke.style.setProperty("--fg",       "var(--paper)");
  spoke.style.setProperty("--fg-soft",  "rgba(217,203,171,.72)");
  spoke.style.setProperty("--hair",     "rgba(217,203,171,.20)");
  window.scrollTo(0,0);
  $("#spoke .brushbtn")?.focus({preventScroll:true});

  wireCards(spoke);
  spoke.querySelector("[data-home]")?.addEventListener("click", home);
}

function sealSVG(k){
  return `<svg viewBox="-80 -80 160 160" aria-hidden="true">
    <circle r="60" fill="${SKIN[k].mass}" opacity=".16"/>
    <circle r="60" fill="none" stroke="${SKIN[k].accent}" stroke-width="4"
      stroke-dasharray="350 30" transform="rotate(-42)"/>
    <path d="${SEAL[k]}" fill="none" stroke="${SKIN[k].accent}" stroke-width="8"
      stroke-linecap="round" stroke-linejoin="round" transform="scale(1.5)"/>
  </svg>`;
}

/* ── Nation body — the header, path timeline, and project cards for one
   nation. Shared by its own spoke page (renderNation) and by the all-work
   compilation (nationSection), so both render identically. ────────────── */
function nationBody(k){
  const n = NATIONS[k];
  const label = n.sectionLabel || "Work";
  const tl = (n.timeline || []).length ? `
    <h2 class="sec-label">Path</h2>
    <div class="timeline">${n.timeline.map(t => `
      <div class="tl-item">
        <div class="tl-when">${esc(t.when)}</div>
        <div>
          <h3>${esc(t.what)}</h3>
          <p>${esc(t.note)}</p>
          ${(t.links||[]).length ? `<div class="link-row">${t.links.map(l =>
            `<a href="${esc(l.href)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a>`).join("")}</div>` : ""}
        </div>
      </div>`).join("")}</div>` : "";

  const cards = (n.projects || []).length
    ? `<div class="grid">${n.projects.map((p,i) => `
        <button class="card" data-all="${k}:${i}">
          <div class="card-body">
            ${p.meta ? `<p class="meta">${esc(p.meta)}</p>` : ""}
            <h3>${esc(p.title)}</h3>
            ${p.summary ? `<p>${esc(p.summary)}</p>` : ""}
            ${(p.tags||[]).length ? `<div class="tags">${p.tags.map(t =>
              `<span class="tag-chip">${esc(t)}</span>`).join("")}</div>` : ""}
          </div>
          <div class="card-media">${p.image ? `<img src="${esc(p.image)}" alt="">` : ""}</div>
        </button>`).join("")}</div>`
    : `<div class="empty">No ${esc(label.toLowerCase())} filed under ${esc(n.name)} yet. Add entries to
       <code>NATIONS.${k}.projects</code>.</div>`;

  return `
    <header class="spoke-head">
      ${sealSVG(k)}
      <div>
        <p class="spoke-kicker">${esc(n.kicker)}</p>
        <h1 class="spoke-title">${esc(n.title)}</h1>
        <p class="spoke-blurb">${esc(n.blurb)}</p>
      </div>
    </header>
    ${tl}
    <h2 class="sec-label">${esc(label)}</h2>
    ${cards}`;
}

function spokeTop(symbol, label){
  return `<div class="spoke-top">
      <button class="brushbtn" data-home><span>&#8592;</span> Back to the map</button>
      <span class="spoke-symbol" role="img" aria-label="${esc(label)}">${symbol}</span>
    </div>`;
}

function renderNation(k){
  const n = NATIONS[k];
  return `<div class="wrap">
    ${spokeTop(sealSVG(k), n.name)}
    ${nationBody(k)}
  </div>`;
}

/* Each nation's block on the all-work page carries its own full-bleed
   background and foreground colors — exactly the palette route() applies
   to #spoke when you visit that nation on its own. An optional `topBar`
   is threaded onto the first section so the page opens straight into that
   nation's colors instead of a separate neutral strip of chrome. */
function nationSection(k, topBar=""){
  return `<section class="nation-block" style="--bg:${SKIN[k].bg};--bg-lift:${SKIN[k].lift};
    --accent:${SKIN[k].accent};--fg:var(--paper);--fg-soft:rgba(217,203,171,.72);
    --hair:rgba(217,203,171,.20)">
    <div class="wrap">${topBar}${nationBody(k)}</div>
  </section>`;
}

function renderAll(){
  const topBar = spokeTop(lotusSVG(), "White Lotus — all four nations");
  return PANEL_ORDER.map((k, i) => nationSection(k, i === 0 ? topBar : "")).join("");
}

/* ── Detail sheet ───────────────────────────────────────────────────────── */
let lastFocus = null;
function openSheet(k, i){
  const p = NATIONS[k].projects[i];
  lastFocus = document.activeElement;
  const sheet = $("#sheet"), panel = $("#panel");
  panel.style.cssText = `--bg:${SKIN[k].lift};--fg:var(--paper);
    --fg-soft:rgba(217,203,171,.74);--accent:${SKIN[k].accent};--hair:rgba(217,203,171,.22)`;
  panel.innerHTML = `<div class="sheet-inner">
    <button class="brushbtn" data-close style="color:var(--fg)"><span>&#8592;</span> Close</button>
    ${p.meta ? `<p class="meta" style="color:var(--accent);font-size:var(--t--1);
      letter-spacing:.2em;text-transform:uppercase;margin:2rem 0 0">${esc(p.meta)}</p>` : ""}
    <h2>${esc(p.title)}</h2>
    ${p.summary ? `<p class="lede">${esc(p.summary)}</p>` : ""}
    ${p.image ? `<div class="sheet-media"><img src="${esc(p.image)}" alt=""></div>` : ""}
    ${(p.links||[]).length ? `<div class="link-row">${p.links.map(l =>
      `<a href="${esc(l.href)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a>`).join("")}</div>` : ""}
    ${p.problem ? `<h4>The problem</h4><p>${esc(p.problem)}</p>` : ""}
    ${(p.decisions||[]).length ? `<h4>Decisions</h4><ul>${
      p.decisions.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}
    ${p.outcome ? `<h4>Outcome</h4><p>${esc(p.outcome)}</p>` : ""}
  </div>`;
  sheet.classList.add("on");
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => sheet.classList.add("in"));
  panel.querySelector("[data-close]").focus();
  panel.querySelectorAll("[data-close]").forEach(b =>
    b.addEventListener("click", () => closeSheet()));
}
function closeSheet(instant){
  const sheet = $("#sheet");
  if (!sheet.classList.contains("on")) return;
  sheet.classList.remove("in");
  document.body.style.overflow = "";
  const kill = () => { sheet.classList.remove("on"); $("#panel").innerHTML = ""; };
  instant ? kill() : setTimeout(kill, 380);
  lastFocus?.focus?.();
}
$("#sheet .scrim").addEventListener("click", () => closeSheet());
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#sheet").classList.contains("on") ? closeSheet() : home(); }
});

window.addEventListener("hashchange", route);
route();
setTimeout(() => $("#hub").classList.remove("boot"), 2600);
</script>
