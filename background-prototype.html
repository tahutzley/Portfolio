<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub background — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">

<!-- ══ src/styles/tokens.css — verbatim ══ -->
<style>/* ═══ TOKENS ══════════════════════════════════════════════════════════════
   The single source of truth for the whole site. Change a value here and it
   propagates everywhere. Transferred unchanged from the original file except
   where noted. */

:root{
  /* Shared ground — the parchment the whole scroll is mounted on */
  --paper:        #b8a276;
  --paper-deep:   #a08a5f;
  --paper-edge:   #86713f;
  --ink:          #241c14;
  --ink-soft:     #4a3b2a;
  --ink-faint:    rgba(36,28,20,.42);
  /* One step below --ink, reserved for edges that have to read as HARD
     against a coloured field rather than as drawn-on-paper. Currently just
     the seal rings — at --ink they sat close enough to the mass colour
     under them that a heavy stroke read as thick rather than as sharp. */
  --ink-deep:     #140e08;

  /* Parchment grain — fine isotropic noise, tiled seamlessly (stitchTiles)
     so no repeat seam or directional streak is visible, kept to a low
     rect opacity so it reads as a faint irregularity in the paper rather
     than a pattern. Baked into each surface's own background via
     background-blend-mode, so it always sits beneath content rather than
     being an overlay drawn on top of cards or links. */
  --grain-img: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='p' x='0%25' y='0%25' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='260' height='260' filter='url(%23p)' opacity='0.14'/></svg>");

  /* Ocean — the connective tissue between every nation.
     --sea-line lifted from #5d5a8c: against --sea-deep that was a soft pair,
     and the seigaiha arcs need to read as distinctly brighter than the field
     the way the reference poster's do. --sea-shadow is new — the dropped
     copy under each arc that gives the wave-scales their quilted relief.
     See the SEIGAIHA block in map/mapSvg.js. */
  --sea:          #3a3760;
  --sea-deep:     #2b2949;
  --sea-line:     #6f6ca6;
  --sea-shadow:   #1e1c35;

  /* Nation grounds — each spoke sits on its own earth.
     The mass / key / glow triples were re-mixed for saturation: every one
     gained 6–10 points of HSL S so the four nations hold their own against
     the seigaiha field, which is a deep saturated purple and was quietly
     out-colouring the land. Three of them also moved in hue or lightness:

       water  hue 203° → ~190°, i.e. off pure sky-blue and into teal
       earth  ~5 points DARKER, so it stops competing with air's near-white
       air    lighter still — the mountain isles read as bleached stone

     Grounds (the per-spoke page backgrounds) are deliberately untouched.
     They are backdrops for body text and any saturation added there costs
     contrast. GLOW_HEX in data/skin.js mirrors the four --*-glow values as
     literals for the SVG filters — change one, change both. */
  --water-ground: #12283c;  --water-mass: #b0dfe9;  --water-key: #66c2d6;  --water-glow: #cfeff7;
  --earth-ground: #1d2716;  --earth-mass: #e0c98a;  --earth-key: #7c9f38;  --earth-glow: #ecdcab;
  --fire-ground:  #240d09;  --fire-mass:  #e87730;  --fire-key:  #d33f12;  --fire-glow:  #f8ae59;
  --air-ground:   #2a1e12;  --air-mass:   #f6f4ee;  --air-key:   #e49221;  --air-glow:   #fbf8f0;

  /* Type scale — major third (1.25), fluid */
  --t--1: clamp(.72rem, .70rem + .12vw, .80rem);
  --t-0:  clamp(1rem, .96rem + .18vw, 1.09rem);
  --t-1:  clamp(1.20rem, 1.13rem + .30vw, 1.36rem);
  --t-2:  clamp(1.44rem, 1.32rem + .52vw, 1.70rem);
  --t-3:  clamp(1.73rem, 1.53rem + .86vw, 2.13rem);
  --t-4:  clamp(2.07rem, 1.75rem + 1.38vw, 2.66rem);
  --t-5:  clamp(2.49rem, 1.98rem + 2.20vw, 3.33rem);

  /* PHASE 1 CHANGE — was a platform-dependent stack of Palatino Linotype /
     Iowan Old Style / Georgia, which resolved to three different typefaces
     depending on the visitor's OS (and to bare `serif` on Linux/Android).
     Now one real webfont, consistent everywhere.
     TODO: self-host as .woff2 to drop the Google Fonts round-trip. */
  --face-serif:   "Spectral", Georgia, "Times New Roman", serif;
  --face-body:    ui-sans-serif,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;

  /* Emphasis — reserved for the handful of proper-noun labels: the site
     name and the four elements. Herculanum ships with
     macOS/iOS but isn't a webfont we can legally self-host without a
     license, so non-Apple visitors fall through to Cinzel (also loaded
     from Google Fonts) — a carved-capitals face that keeps the same
     "chiseled stone" register instead of collapsing to the body serif. */
  --face-emphasis: Herculanum, Cinzel, var(--face-serif), serif;

  --measure: 62ch;
  --ease-ink: cubic-bezier(.22,.68,.24,1);

  /* Motion timings — one place so the whole site stays in step */
  --dur-hover:  .45s;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:var(--t-0)/1.65 var(--face-body);
  overflow-x:hidden;
}

/* ═══ SCROLLBARS ══════════════════════════════════════════════════════════
   The page scroll and the detail sheet's own inner scroll are two separate
   scrolling boxes (window vs. element), which browsers render with
   different default chrome. Style both explicitly so they paint identically. */
html,#sheet .panel{
  scrollbar-width:thin;
  scrollbar-color:var(--ink-soft) var(--paper-deep);
}
html::-webkit-scrollbar,#sheet .panel::-webkit-scrollbar{width:12px}
html::-webkit-scrollbar-track,#sheet .panel::-webkit-scrollbar-track{background:var(--paper-deep)}
html::-webkit-scrollbar-thumb,#sheet .panel::-webkit-scrollbar-thumb{
  background:var(--ink-soft);border-radius:7px;border:3px solid var(--paper-deep)}
html::-webkit-scrollbar-thumb:hover,#sheet .panel::-webkit-scrollbar-thumb:hover{background:var(--ink)}

::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2.5px solid currentColor;outline-offset:4px;border-radius:2px}

/* ═══ SHARED PARTS ════════════════════════════════════════════════════════
   `.cartouche` and `.rule` lived here in the original and were never
   emitted by any renderer. Dropped. */
.brushbtn{
  font:600 var(--t--1)/1 var(--face-body);
  letter-spacing:.16em;text-transform:uppercase;
  background:none;border:0;color:inherit;cursor:pointer;
  padding:.9em 0;display:inline-flex;gap:.7em;align-items:center;
}
.brushbtn span{display:inline-block;transition:transform .35s var(--ease-ink)}
.brushbtn:hover span:first-child{transform:translateX(-5px)}
</style>
<!-- ══ src/styles/hub.css — verbatim ══ -->
<style>/* ═══ HUB — the scroll ════════════════════════════════════════════════════
   Full-bleed page. The parchment fiber texture is part of #hub's own
   background (background-blend-mode multiplies the grain into the paper
   color at the paint step), so it sits beneath every child element —
   cards and the linktree paint on top of it, never under an overlay. */
#hub{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:clamp(1rem,3vw,2.5rem);
  background-color:var(--paper);
  background-image:var(--grain-img);
  background-blend-mode:multiply;
  background-size:260px 260px;
}

.hub-head{text-align:center;max-width:90vw;margin:clamp(.5rem,2vw,1.5rem) auto clamp(1rem,2.5vw,2rem)}
.hub-name{
  font-family:var(--face-serif);
  font-size:clamp(1rem, 2.6vw, 1.7rem);line-height:1;margin:0;
  letter-spacing:.01em;font-weight:500;
  white-space:nowrap;
}
.hub-line{margin:1.1em auto 0;max-width:46ch;color:var(--ink-soft);font-size:var(--t-0);
  font-family:var(--face-serif)}

.map-frame{width:min(100%,1180px);margin-inline:auto}
.map-frame svg{display:block;width:100%;height:auto}

/* ═══════════════════════════════════════════════════════════════════════════
   PHASE 3 — MAP HOVER
   ───────────────────────────────────────────────────────────────────────────
   Three things happen together, and they are deliberately the ONLY three:

     1. the hovered nation grows a glow that traces its actual coastline
     2. every other nation desaturates to near-grey
     3. the ocean recedes a step darker

   The old `translateY(-7px)` island lift is intentionally absent. See
   REDESIGN-PLAN.md Phase 3 — it is three lines to restore if the map still
   reads flat once these three are in, but adding it now risks the whole
   thing feeling busy.

   `.is-hot` is set by JS rather than relying on :hover, so the same visual
   state can be driven by focus, touch, or programmatically.
   ═══════════════════════════════════════════════════════════════════════ */

.region{cursor:pointer}
.region:focus-visible{outline:none}

/* — 1. Coastline glow —————————————————————————————————————————————————
   A duplicate of the landmass shapes, permanently wearing the per-nation
   glow filter, sitting *behind* the real ones. Only its opacity animates.

   This is the important performance decision: tweening the filter's own
   stdDeviation/flood-opacity would re-run the whole feMorphology →
   feGaussianBlur graph every frame, which is expensive over shapes this
   large. Fading a pre-rendered filtered layer is a compositor-only
   operation, so it stays cheap even on mobile. */
.region .glow-layer{
  opacity:0;
  pointer-events:none;
  transition:opacity var(--dur-hover) var(--ease-ink);
}
.region.is-hot .glow-layer{opacity:1}

/* — 2. Desaturate the others ——————————————————————————————————————————
   Was `opacity:.55`, which let the seigaiha wave pattern show *through* the
   landmasses and turned them muddy rather than recessed. Desaturating keeps
   them fully opaque and drops them to near-greyscale, so the hovered nation
   is the only colour on the map. */
.map-frame.dim .region:not(.is-hot){
  filter:saturate(.10) brightness(.80);
}
.region{transition:filter var(--dur-hover) var(--ease-ink)}

/* Keep the hovered nation's own ink crisp while everything else greys out.
   The transition has to be declared on .mass itself — the one on .region
   above governs a different element and won't reach these. Without it the
   three cold nations fade over 450ms while the hot one snaps. */
.region .mass{transition:filter var(--dur-hover) var(--ease-ink)}
.region.is-hot .mass{filter:saturate(1.06) brightness(1.04)}

/* — 3. Ocean recede ————————————————————————————————————————————————————
   A dark veil over the seigaiha field, transparent at rest. Pulling the
   whole sea back a step is what sells the depth now that the lift is gone. */
#oceanVeil{
  opacity:0;
  pointer-events:none;
  transition:opacity var(--dur-hover) var(--ease-ink);
}
.map-frame.dim #oceanVeil{opacity:.42}

/* Corner seals answer the map */
/* Rest opacity was .5, which on top of the old dark plate left the seals
   reading as smudges. It has to be high: these sit on the seigaiha, so
   whatever the plate does NOT cover is deep purple showing through, and
   anything much below .85 turns bright paper into grey-violet mud. .88
   still reads as a step down from a lit seal without doing that. */
.seal{
  opacity:.88;
  transition:opacity .45s var(--ease-ink), filter var(--dur-hover) var(--ease-ink);
}

/* And the seals have to answer the dim, not just the map. At .5 they were
   faint enough that nobody noticed they held full saturation while every
   region greyed out; at .88 they are not, and three bright coloured discs
   sitting over a desaturated map reads as an oversight. Same filter as
   `.map-frame.dim .region:not(.is-hot)` above — one rule, one look. */
.map-frame.dim .seal:not(.lit){filter:saturate(.10) brightness(.80)}
.seal .seal-mark{transition:transform .45s var(--ease-ink);transform-box:fill-box;transform-origin:center}
.seal.lit{opacity:1}
.seal.lit .seal-mark{transform:scale(1.04)}

.hub-foot{
  width:min(100%,1180px);margin:clamp(1.2rem,3vw,2.4rem) auto 0;
  display:flex;flex-wrap:wrap;gap:.4em 2.2em;justify-content:center;
  padding:1.4rem 1rem 1.6rem;border-top:1px solid var(--ink-faint);
}
.hub-foot a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--ink-faint);
  font-size:var(--t--1);letter-spacing:.14em;text-transform:uppercase;padding-bottom:.25em}
.hub-foot a:hover{color:var(--ink);border-color:var(--ink)}

/* Panel grid — the four sections named plainly. Doubles as the tap-target
   grid on small screens, where the map's regions go inert (see .region
   pointer-events rule in responsive.css), and where .allwork-card below
   joins them. */
.panel-grid{
  width:min(100%,1180px);margin:clamp(1.6rem,3.4vw,2.6rem) auto 0;
  display:grid;grid-template-columns:1fr 1fr;gap:clamp(.7rem,1.8vw,1rem);
}
.panel-card{
  position:relative;display:flex;align-items:center;gap:1.15rem;
  background:var(--paper-deep);
  border:1px solid var(--ink-faint);
  padding:clamp(1.1rem,2.6vw,1.5rem) clamp(1.2rem,3vw,1.7rem);
  text-align:left;font:inherit;color:inherit;cursor:pointer;
  transition:transform .4s var(--ease-ink),border-color .4s var(--ease-ink),
             background-color .4s var(--ease-ink),box-shadow .4s var(--ease-ink);
}
.panel-card svg{width:clamp(44px,5.6vw,56px);height:clamp(44px,5.6vw,56px);flex:none;
  transition:transform .45s var(--ease-ink)}
.panel-card .pc-text{min-width:0}
.panel-card .pc-text b{display:block;font-family:var(--face-emphasis);font-weight:500;
  font-size:var(--t-2);letter-spacing:.01em}
.panel-card .pc-text i{display:block;font-style:normal;margin-top:.3em;font-size:var(--t--1);
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);
  transition:color .4s var(--ease-ink)}
.panel-card:hover,.panel-card:focus-visible{
  transform:translateY(-5px);
  border-color:var(--pk);
  background:color-mix(in srgb, var(--pk) 22%, var(--paper-deep));
  box-shadow:0 16px 32px -20px var(--pk);
}
.panel-card:hover svg,.panel-card:focus-visible svg{transform:scale(1.08) rotate(-4deg)}
.panel-card:hover .pc-text i,.panel-card:focus-visible .pc-text i{color:var(--pk)}
.panel-card:focus-visible{outline:none}

/* All-work fallback — replaced the White Lotus card. Hidden by default:
   the top cartouche on the map frame is the real control (see #allWork
   below), and above the breakpoint two of the same button is noise.

   880px is not an arbitrary number. It is the same breakpoint responsive.css
   uses to make the map's regions inert, and by then the map has scaled down
   far enough that the cartouche's inscription is a handful of pixels tall —
   so exactly where the frame stops being usable navigation, the grid picks
   it up. No mark: it isn't a nation and shouldn't borrow a nation's
   vocabulary, so it gets the text treatment and the sea's accent.

   NOTE: this element also carries `.panel-card`, so any blanket .panel-card
   rule reaches it. Phase 5's elemental hovers must be scoped to
   [data-nation] to avoid catching it. */
.allwork-card{display:none;--pk:var(--sea-line)}

@media (max-width:880px){
  .allwork-card{display:flex;grid-column:1/-1;justify-content:center;text-align:center}
}
@media (max-width:600px){
  .panel-grid{grid-template-columns:1fr}
  .allwork-card{grid-column:auto}
}

/* ═══ THE ALL-WORK CARTOUCHE ══════════════════════════════════════════════
   The plaque centred on the map's top frame band. It is an SVG <g> carrying
   role="link" and tabindex, not a <button>, so everything a button would
   give for free is spelled out: the pointer, the focus ring, and (in
   main.js) Enter/Space activation.

   The plaque used to lift 6px on hover. It doesn't any more: the hover now
   lights the entire map at once (see hover.js — the plaque sets .is-hot on
   every region and .lit on every seal, the same state a single nation gets),
   and a plate sliding upward on top of four coastlines igniting is one
   motion too many. The .cart-face wrapper stays in meander.js: any future
   transform on this plaque has to go on it and not on #allWork, whose
   `transform` attribute is what positions it on the frame — a CSS transform
   would override that presentation attribute and drop it at the origin. */
#allWork{cursor:pointer}
#allWork:focus-visible{outline:none}
/* Lengths inside an SVG resolve to user units, not CSS pixels — 30 here is
   30 of the map's 1728-unit width, which lands around 20px at full size. */
#allWork text{
  font-family:var(--face-body);font-size:30px;font-weight:600;
  letter-spacing:.2em;pointer-events:none;
}
#allWork .plate{transition:fill .4s var(--ease-ink),stroke-opacity .4s var(--ease-ink)}
#allWork:hover .plate,
#allWork:focus-visible .plate{fill:#f0e6cf;stroke-opacity:1}
#allWork:focus-visible .plate{stroke-width:7}
</style>
<!-- ══ src/styles/responsive.css — verbatim ══ -->
<style>/* ═══ RESPONSIVE ══════════════════════════════════════════════════════════
   Below 880px the four map regions go inert — hover doesn't exist on touch,
   and the map's tap targets are too small and too irregular to be reliable
   navigation. The map stays visible and still boots; it just becomes
   decoration. The panel cards below it are the real navigation.

   Note this targets `.region`, not the map itself — the SVG continues to
   render, animate in, and carry the frame. */
@media (max-width:880px){
  .region{pointer-events:none}
  .tl-item{grid-template-columns:1fr;gap:.6rem}
  .card{grid-template-columns:1fr}
  .card-media{display:none}
  .spoke-head{grid-template-columns:1fr}
}

/* No hover hardware at all (touch-primary devices).

   Between 880px and desktop width the regions are still interactive, and a
   tap that turns into a scroll fires mouseenter with no mouseleave ever
   following — stranding the map with one nation glowing and the other
   three permanently dimmed. hover.js refuses to enter the hot state on
   touch, and this block is the belt to that suspenders: every hot-state
   rule gets neutralised, not just the desaturation. */
@media (hover:none){
  .map-frame.dim .region:not(.is-hot){filter:none}
  .map-frame.dim #oceanVeil{opacity:0}
  .region.is-hot .glow-layer{opacity:0}
  .region.is-hot .mass{filter:none}
  /* The seals are lit from the same state as .is-hot, so they need
     suppressing too — otherwise they brighten alone, with none of the
     other cues, which reads as a glitch rather than an affordance.

     This value has to track the rest opacity in hub.css, not sit at some
     independent number: the point is to make a lit seal look UNLIT, and
     when rest went .5 → .88 this was left behind, so on touch a tapped seal
     went darker than its neighbours instead of matching them. */
  .seal.lit{opacity:.88}
  .seal.lit .seal-mark{transform:none}

  /* .region:focus-visible drops its outline on the assumption that the
     glow IS the focus affordance. Everything above just switched the glow
     off — so on a tablet with a keyboard attached, tabbing the map would
     otherwise show nothing at all. Put a real outline back. */
  .region:focus-visible{outline:2.5px solid var(--paper);outline-offset:2px}
}
</style>

<!-- ══ THE PROPOSED ADDITION — the only new CSS ══ -->
<style>
#hub{ position:relative; isolation:isolate; }

.hub-ink{
  position:absolute; inset:0; z-index:0;
  pointer-events:none; overflow:hidden;
  color:var(--ink);
  opacity:var(--ink-strength,.13);
  transition:opacity .3s linear;
}
.hub-ink svg{ width:100%; height:100%; display:block; }

/* Content steps over the ink. The map frame's outer band is opaque paper,
   so the middle of every stroke is occluded by the chart and only the ends
   show, in the gutters. Nothing is masked — that is deliberate. */
.hub-head,.map-frame,.panel-grid,.hub-foot{ position:relative; z-index:1; }
</style>

<div id="lab">
  <span style="opacity:.55">INK</span>
  <button data-v="off">Off</button>
  <button data-v="A">A · Horizontals</button>
  <button data-v="B">B · Gutter verticals</button>
  <button data-v="C">C · Mixed</button>
  <button data-v="D">D · Sparse</button>
  <label>Strength <input type="range" id="str" min="0" max="200" step="1" value="130"><code id="strv">.070</code></label>
</div>

<main id="hub">
  <div class="hub-ink" id="inkLayer" aria-hidden="true"></div>

  <header class="hub-head">
    <h1 class="hub-name"><span id="hub-title">Hi, my name is Timothy and I'm a full stack developer.</span></h1>
    <p class="hub-line" id="hub-line"></p>
  </header>

  <div class="map-frame" id="mapFrame"><svg id="map" viewBox="-64 -84 1728 1168" role="group"
       aria-label="Interactive map. Four regions lead to four sections of work.">
    <defs>
    <!-- Seigaiha: the traditional wave-scale field that carries the ocean -->
    <g id="scallop-arcs" fill="none"><path d="M-28,0 A28,28 0 0,1 28,0"/><path d="M-23.2,0 A23.2,23.2 0 0,1 23.2,0"/><path d="M-18.4,0 A18.4,18.4 0 0,1 18.4,0"/><path d="M-13.6,0 A13.6,13.6 0 0,1 13.6,0"/><path d="M-8.8,0 A8.8,8.8 0 0,1 8.8,0"/><path d="M-4,0 A4,4 0 0,1 4,0"/></g>
    <g id="scallop">
      <use href="#scallop-arcs" transform="translate(0,1.4)"
           stroke="var(--sea-shadow)" stroke-width="2.2" opacity=".45"/>
      <use href="#scallop-arcs" stroke="var(--sea-line)" stroke-width="1.9"/>
    </g>
    <pattern id="waves" width="56" height="28" patternUnits="userSpaceOnUse">
      <rect width="56" height="28" fill="var(--sea-deep)"/>
      <use href="#scallop" transform="translate(-28,28)"/>
      <use href="#scallop" transform="translate(28,28)"/>
      <use href="#scallop" transform="translate(84,28)"/>
      <use href="#scallop" transform="translate(0,14)"/>

                stroke-dasharray="300 26" transform="rotate(-42)"/>
        <path d="M 0 -20 C 12 -6, 14 8, 2 18 C -10 8, -12 -4, 0 -20 M 0 6 C 5 0, 4 -7, 0 -12" fill="none" stroke="var(--ink)" stroke-width="6.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g><g class="seal" data-seal="earth" transform="translate(1420,840)">
      <g class="seal-mark">
        <!-- MAP-POLISH-PLAN.md §2.6. The plate was --paper-deep on
             --paper-edge — a mid tan on a slightly darker tan — and hub.css
             holds seals at reduced opacity at rest, which together rendered
             them as muddy grey squares rather than stamps. Same border
             vocabulary as the frame now: bright paper field, hard ink
             keyline, an inset rule inside it. -->
        <rect x="-74" y="-74" width="148" height="148" fill="var(--paper)"
              stroke="var(--ink)" stroke-width="5" stroke-opacity=".62"/>
        <rect x="-64" y="-64" width="128" height="128" fill="none"
              stroke="var(--ink)" stroke-width="2" stroke-opacity=".32"/>
        <circle r="52" fill="var(--earth-mass)" opacity=".95"/>
        <circle r="52" fill="none" stroke="var(--ink)" stroke-width="3.5" opacity=".55"
                stroke-dasharray="300 26" transform="rotate(-42)"/>
        <path d="M -20 14 H 20 M 0 14 V -12 M -12 -2 H 12" fill="none" stroke="var(--ink)" stroke-width="6.5"
              stroke-linecap="round" stroke-linejoin="round"/>

  <div class="panel-grid" id="panelGrid"></div>

  <nav class="hub-foot" id="hubFoot">
    <a href="#">Email</a><a href="#">GitHub</a><a href="#">LinkedIn</a><a href="#">Resume</a>
  </nav>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   INK — dry-brush calligraphy strokes, generated.

   Built the way the mark is actually made, which is the opposite of how it
   first looks. A dry stroke is not bristles drawn one by one — it is a
   SOLID slab of ink with streaks taken back out of it:

     body      a filled bar, near-constant thickness, ragged top and bottom
     streaks   thin voids cut out by a mask, crowding toward the tail
     tail      loose filaments running past the body where the brush lifted
     spatter   flecks thrown off the edges

   Drawing it in that order is what produces the reference's hard black core
   with sharp thin gaps, rather than the even cross-hatch you get from
   stacking N filaments and hoping they overlap.

   Everything is seeded. The same drawing renders every load, so two
   variants can be compared without the artwork moving underneath you.
   ═══════════════════════════════════════════════════════════════════════ */

function rng(seed){
  let s = (seed >>> 0) || 1;
  return () => (s ^= s << 13, s ^= s >>> 17, s ^= s << 5, (s >>> 0) / 4294967296);
}

/* Smooth periodic noise. Used for every irregularity here — the point is
   that edges wander CONTINUOUSLY. Per-sample randomness reads as sawtooth
   hatching, which was the first attempt's mistake. */
function noise1(seed, n = 96){
  const r = rng(seed), g = Array.from({ length: n }, r);
  return t => {
    const x = (((t % 1) + 1) % 1) * n, i = Math.floor(x), f = x - i;
    const u = f * f * (3 - 2 * f);
    return g[i % n] * (1 - u) + g[(i + 1) % n] * u - .5;
  };
}
/* Two octaves — a slow swell plus a finer tremor. */
function noise2(seed){
  const a = noise1(seed), b = noise1(seed * 7919 + 11);
  return t => a(t) + .45 * b(t * 3.1);
}

function spline(pts, samples){
  if (pts.length === 2){
    const out = [];
    for (let i = 0; i <= samples; i++){
      const t = i / samples;
      out.push([pts[0][0] + (pts[1][0] - pts[0][0]) * t,
                pts[0][1] + (pts[1][1] - pts[0][1]) * t]);
    }
    return out;
  }
  const P = [pts[0], ...pts, pts[pts.length - 1]], out = [];
  for (let i = 0; i < P.length - 3; i++){
    const [p0, p1, p2, p3] = [P[i], P[i + 1], P[i + 2], P[i + 3]];
    for (let s = 0; s < samples; s++){
      const t = s / samples, t2 = t * t, t3 = t2 * t;
      out.push([
        .5*((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        .5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      ]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}

/* Frame: centreline samples plus unit normals, so body / streaks / tail all
   share one geometry and stay registered to each other. */
function frame(pts, samples){
  const c = spline(pts, samples), N = c.length, n = [];
  for (let i = 0; i < N; i++){
    const a = c[Math.max(0, i - 1)], b = c[Math.min(N - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const m = Math.hypot(dx, dy) || 1;
    n.push([-dy / m, dx / m]);
  }
  return { c, n, N };
}
const at = (F, i, off) => [F.c[i][0] + F.n[i][0] * off, F.c[i][1] + F.n[i][1] * off];
const fmt = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);

/* ── one stroke ───────────────────────────────────────────────────────────
   w        half-width of the bar
   taper    how much the tail thins (0 = parallel-sided, 1 = to a point)
   rough    amplitude of the top/bottom edge wander, as a fraction of w
   streaks  how many dry voids get cut out
   dry      how far up the stroke the voids reach (0 = tail only, 1 = all of it)
   tail     how many loose filaments run past the body
   reach    how far past the body those filaments go, as a fraction of length
   blunt    1 = square landing at the start, 0 = the start is torn too
   spatter  fleck count
*/
function stroke(pts, opts = {}){
  const {
    w = 30, taper = .35, rough = .30, streaks = 46, dry = .55,
    tail = 26, reach = .10, blunt = 1, spatter = 12,
    seed = 1, samples = 34
  } = opts;

  const F = frame(pts, samples), { N } = F;
  const R = rng(seed);
  const eTop = noise2(seed * 13 + 1);
  const eBot = noise2(seed * 29 + 3);

  /* Width envelope. Deliberately NOT a sine swell — a real drag stays close
     to parallel and only gives up at the very end. The first attempt's
     almond silhouette came from swelling in the middle. */
  const halfW = t => w * (1 - taper * Math.pow(Math.max(0, t - .45) / .55, 1.8));

  /* ── body ──────────────────────────────────────────────────────────────
     One closed polygon: top edge forward, bottom edge back. Both edges
     wander independently, so the bar is never symmetric about its spine. */
  const top = [], bot = [];
  for (let i = 0; i < N; i++){
    const t = i / (N - 1);
    const hw = halfW(t);
    /* The start is squared off unless `blunt` says otherwise; the last 12%
       pulls in hard so the tail terminates instead of being cut. */
    const cap = Math.min(1, t / (blunt ? .012 : .10)) * Math.min(1, (1 - t) / .06);
    /* Edges get rougher as the brush empties — a wet start is smooth-sided,
       a dry finish is not. Without this ramp the raggedness reads as a
       uniform sawtooth applied to the whole bar. */
    const rr = rough * (.55 + .95 * t);
    top.push(at(F, i,  (hw * (1 + rr * eTop(t))) * cap));
    bot.push(at(F, i, -(hw * (1 + rr * eBot(t))) * cap));
  }
  const body = `<path d="M${top.map(fmt).join('L')}L${bot.reverse().map(fmt).join('L')}Z"/>`;

  /* ── tail filaments ───────────────────────────────────────────────────
     Where the brush lifts, the outer bristles keep going and separate. They
     run past the body end along the extrapolated tangent. */
  const tips = [];
  const endT = F.c[N - 1], endN = F.n[N - 1];
  const tx = -endN[1], ty = endN[0];
  const len = Math.hypot(F.c[N-1][0] - F.c[0][0], F.c[N-1][1] - F.c[0][1]);
  for (let k = 0; k < tail; k++){
    const u  = (R() * 2 - 1);
    /* Start late. The fray is a short zone at the very end of the drag —
       filaments that begin halfway down turn the whole back half into
       parallel hairlines, which is the one thing the reference never does. */
    const i0 = Math.floor(N * (.80 + R() * .17));
    const off = u * halfW(i0 / (N - 1)) * (.35 + R() * .85);
    const pts2 = [];
    for (let i = i0; i < N; i++) pts2.push(at(F, i, off * (i - i0) / Math.max(1, N - 1 - i0) * .6 + off * .4));
    const ext = len * reach * (.25 + R() * .95);
    const end = [F.c[N-1][0] + tx * ext + endN[0] * off * 1.25,
                 F.c[N-1][1] + ty * ext + endN[1] * off * 1.25];
    pts2.push(end);
    if (pts2.length > 1)
      tips.push(`<path fill="none" stroke="currentColor" stroke-linecap="round"` +
                ` stroke-width="${(.6 + R() * 1.7).toFixed(2)}"` +
                ` d="M${pts2.map(fmt).join('L')}"/>`);
  }

  /* ── spatter ──────────────────────────────────────────────────────────
     Along the whole stroke, not just past the tip — ink flicks off an edge
     wherever the brush changes speed. Kept close; strays read as dirt. */
  const flecks = [];
  for (let s = 0; s < spatter; s++){
    const i = Math.floor(N * (.25 + R() * .78) % N);
    const side = R() < .5 ? -1 : 1;
    const off = side * halfW(i / (N - 1)) * (1.05 + Math.pow(R(), 2) * .9);
    const p = at(F, i, off);
    flecks.push(`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}"` +
                ` r="${(.5 + R() * 1.7).toFixed(2)}"/>`);
  }

  /* ── streaks (mask content) ───────────────────────────────────────────
     Thin voids running WITH the stroke. Two things make them read as dry
     brush rather than scratches: they follow the centreline exactly, and
     their density is biased toward the tail and toward the rim, because
     that is where a brush runs out first. */
  const cuts = [];
  for (let k = 0; k < streaks; k++){
    const bias = Math.pow(R(), 1 - dry * .75);      // dry → pushes t0 later
    const t0 = .04 + bias * .82;
    /* Short. A void is where a few bristles skipped for a moment, not a
       channel running the length of the stroke — R()³ keeps most of them
       brief and lets the occasional one run. */
    const t1 = Math.min(1.0, t0 + .05 + Math.pow(R(), 3) * .40 * (dry + .35));
    const i0 = Math.round(t0 * (N - 1)), i1 = Math.round(t1 * (N - 1));
    if (i1 - i0 < 2) continue;
    const rim = Math.pow(R(), .55);                  // crowd toward the edges
    const u = (R() < .5 ? -1 : 1) * rim;
    const wob = noise1(seed * 101 + k * 17);
    const pts2 = [];
    for (let i = i0; i <= i1; i++){
      const t = i / (N - 1);
      pts2.push(at(F, i, u * halfW(t) * .92 + wob(t * 2.2) * w * .10));
    }
    cuts.push(`<path d="M${pts2.map(fmt).join('L')}"` +
              ` stroke-width="${(.7 + R() * R() * 4.2).toFixed(2)}"/>`);
  }

  return { ink: body + tips.join('') + `<g stroke="none">${flecks.join('')}</g>`,
           cut: cuts.join('') };
}

/* ══ COMPOSITIONS ══════════════════════════════════════════════════════════
   Canvas 1600×1000, preserveAspectRatio="xMidYMid slice".

   Placement rule: strokes run off the canvas edge. The map frame's outer
   band is opaque paper, so the middle of a full-width stroke is simply
   COVERED by the chart and only its ends show, in the gutters — the ink
   reads as something the map was laid down on top of. Nothing is masked to
   avoid the map; the occlusion does that work by itself.
   ═══════════════════════════════════════════════════════════════════════ */

const COMPOSITIONS = {
  /* A — long horizontals top and bottom, two short ones holding the gutters. */
  A: [
    [[[-280, 122], [420, 108], [1120, 126], [1900, 112]],
     { w: 26, taper: .30, rough: .26, streaks: 54, dry: .55, tail: 30, seed: 101 }],
    [[[-240, 936], [560, 950], [1320, 930], [1900, 944]],
     { w: 31, taper: .26, rough: .24, streaks: 62, dry: .48, tail: 34, seed: 202 }],
    [[[1900, 452], [1430, 468], [1120, 450]],
     { w: 20, taper: .45, rough: .34, streaks: 32, dry: .70, tail: 22, seed: 303, spatter: 9 }],
    [[[-260, 690], [140, 704], [430, 688]],
     { w: 17, taper: .50, rough: .36, streaks: 26, dry: .74, tail: 20, seed: 404, spatter: 8 }],
  ],

  /* B — the same brush turned upright. Fits the gutters' shape better and
       reads more like a hanging scroll. */
  B: [
    [[[188, -260], [172, 300], [200, 700], [180, 1260]],
     { w: 26, taper: .28, rough: .26, streaks: 56, dry: .55, tail: 30, seed: 511 }],
    [[[1412, -240], [1436, 280], [1410, 700], [1430, 1260]],
     { w: 22, taper: .30, rough: .30, streaks: 46, dry: .62, tail: 26, seed: 622 }],
    [[[-240, 946], [420, 958], [980, 940]],
     { w: 18, taper: .48, rough: .34, streaks: 28, dry: .72, tail: 20, seed: 733, spatter: 9 }],
  ],

  /* C — mixed: two horizontals bracketing the page, two gutter verticals. */
  C: [
    [[[-280, 118], [520, 104], [1240, 124], [1900, 110]],
     { w: 25, taper: .30, rough: .26, streaks: 52, dry: .56, tail: 28, seed: 141 }],
    [[[-240, 940], [600, 954], [1360, 932], [1900, 948]],
     { w: 30, taper: .26, rough: .24, streaks: 60, dry: .48, tail: 32, seed: 242 }],
    /* blunt:0 — these two begin and end inside the canvas, and a squared-off
       landing there reads as a cut bar rather than a brush set down. The
       long horizontals above run off the edge, so they keep their blunt
       start; nobody ever sees it. */
    [[[186, 250], [170, 540], [198, 810]],
     { w: 16, taper: .42, rough: .34, streaks: 26, dry: .70, tail: 18, blunt: 0, seed: 343, spatter: 8 }],
    [[[1414, 800], [1434, 520], [1410, 280]],
     { w: 14, taper: .46, rough: .36, streaks: 22, dry: .74, tail: 16, blunt: 0, seed: 444, spatter: 7 }],
  ],

  /* D — sparse. One behind the name, one under the grid. The "how little
       works" answer, and the safest thing to ship. */
  D: [
    [[[-280, 124], [560, 110], [1300, 128], [1900, 114]],
     { w: 24, taper: .32, rough: .26, streaks: 50, dry: .58, tail: 28, seed: 909 }],
    [[[-240, 942], [640, 956], [1420, 934], [1900, 950]],
     { w: 29, taper: .26, rough: .24, streaks: 58, dry: .50, tail: 32, seed: 818 }],
  ]
};

/* The layer. `currentColor` so the ink colour is set once in CSS on
   .hub-ink, and a future dark surface could recolour it without a rebuild.

   One mask for the whole layer rather than one per stroke: masks are the
   expensive part, and the streaks never need to be addressed individually. */
function inkSVG(variant){
  const set = COMPOSITIONS[variant] || [];
  const parts = set.map(([pts, o]) => stroke(pts, o));
  const id = 'dry-' + variant;
  return `<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"
       aria-hidden="true" focusable="false">
  <defs>
    <mask id="${id}" maskUnits="userSpaceOnUse" x="-400" y="-400" width="2400" height="1800">
      <rect x="-400" y="-400" width="2400" height="1800" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
        ${parts.map(p => p.cut).join('')}
      </g>
    </mask>
  </defs>
  <g fill="currentColor" mask="url(#${id})">
    ${parts.map(p => p.ink).join('')}
  </g>
</svg>`;
}



const layer = document.getElementById('inkLayer');
const hub   = document.getElementById('hub');
let current = 'C';

function paint(){
  layer.innerHTML = current === 'off' ? '' : inkSVG(current);
  document.querySelectorAll('#lab button').forEach(b => b.classList.toggle('on', b.dataset.v === current));
}
document.querySelectorAll('#lab button').forEach(b =>
  b.addEventListener('click', () => { current = b.dataset.v; paint(); }));

const str = document.getElementById('str'), strv = document.getElementById('strv');
str.addEventListener('input', () => {
  const v = +str.value / 1000;
  hub.style.setProperty('--ink-strength', v.toFixed(3));
  strv.textContent = v.toFixed(3).replace(/^0/, '');
});

/* panel cards — same markup shape as main.js emits */
const CARDS = [
  ['Data Work','Analysis · Modelling','#7fb4d6'],
  ['Applications','Full stack · Shipped','#7d9c46'],
  ['Experiments','Prototypes · Play','#c8451c'],
  ['Writing','Reports · Briefs','#d98f2c'],
];
document.getElementById('panelGrid').innerHTML = CARDS.map(([b,i,k]) => `
  <button class="panel-card" style="--pk:${k}">
    <svg viewBox="-40 -40 80 80"><circle r="30" fill="none" stroke="${k}" stroke-width="4"
      stroke-dasharray="170 18" transform="rotate(-42)"/></svg>
    <span class="pc-text"><b>${b}</b><i>${i}</i></span>
  </button>`).join('');

str.dispatchEvent(new Event('input'));
paint();
</script>
